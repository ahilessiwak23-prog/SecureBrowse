
name: Build SecureBrowse APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract project
        run: unzip -q SecureBrowse-v2.zip -d project

      - name: Build Android APK
        run: |
          cd project/SecureBrowse-v2
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecureBrowse-APK
          path: project/SecureBrowse-v2/app/build/outputs/apk/debug/app-debug.apk
          
